# mitmania service configuration.
#
# Loaded by mitmania.service as an EnvironmentFile. Keep it readable by
# root only because MITMANIA_CLUSTER_KEY protects every durable cluster
# secret.

# Required. Generate once per cluster with: openssl rand -base64 32
MITMANIA_CLUSTER_KEY=

# Persistent state and the local control socket use the systemd-managed
# StateDirectory and RuntimeDirectory from mitmania.service.
MITMANIA_STORAGE=posix:///var/lib/mitmania
MITMANIA_CONTROL=unix:///run/mitmania/mitmania.sock

# Explicit forward-proxy listener. TLS remains end-to-end when matching rules
# select mitm:false; clients do not need the signing CA for those connections.
MITMANIA_LISTEN_HTTP_PROXY=tcp://0.0.0.0:3128

MITMANIA_LOG_LEVEL=info
MITMANIA_LOG_FORMAT=json
