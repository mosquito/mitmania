name: docs

on:
  pull_request:
  push:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement requirements-docs.txt
      - name: Compile documentation rule snippets
        run: go test ./internal/rules -run DocumentationRuleSnippets
      - name: Build documentation and check links
        run: mkdocs build --strict

  # Builds the versioned site with mike, mkdocs-material's versioning tool, then
  # publishes it through GitHub Pages' Actions-based deployment. mike still commits
  # each deploy to the gh-pages branch (under a version directory, e.g. "dev" or a
  # release tag, plus a "latest" alias) - that branch is only used as mike's durable
  # history of built versions across runs. This repo's Pages source is configured as
  # "GitHub Actions" (build_type: workflow, confirmed via the Pages API), which never
  # serves the branch directly, so the freshly-committed gh-pages tree is re-checked
  # out and uploaded as a Pages artifact, then published with actions/deploy-pages.
  #
  # Only runs for pushes to the repo's default branch and for published GitHub
  # releases - never for pull requests, so untrusted PR branches can't push docs.
  deploy:
    name: Deploy documentation (mike + GitHub Pages)
    needs: build
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    # A push to the default branch and a published release can trigger this
    # job within moments of each other (as happened in practice), and both
    # paths push to the same gh-pages branch via `mike deploy --push`. mike
    # doesn't retry on a non-fast-forward rejection, so without this the
    # second deploy to land just fails outright. One shared group across
    # every trigger queues them instead of racing; cancel-in-progress stays
    # false because both deploys are meaningful and neither should be
    # dropped.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement requirements-docs.txt
      - name: Configure git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy in-development docs (pushes to the default branch)
        if: github.event_name == 'push'
        run: mike deploy --push --update-aliases dev latest
      - name: Deploy versioned release docs (published GitHub releases)
        if: github.event_name == 'release'
        run: mike deploy --push --update-aliases "${{ github.event.release.tag_name }}" latest
      - name: Point the site root at the latest version
        run: mike set-default --push latest
      - name: Check out the published gh-pages tree
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-site
      - id: deployment
        uses: actions/deploy-pages@v4
