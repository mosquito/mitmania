name: release

on:
  release:
    types:
      - published

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test release tag
    runs-on: ubuntu-latest
    env:
      S3_URL: "s3://test:test@127.0.0.1:9090/?bucket=mitmania-test&region=us-east-1&secure=false"
    services:
      s3mock:
        image: adobe/s3mock:5.1.0
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: mitmania-test
        ports:
          - 9090:9090
        options: >-
          --health-cmd "wget --spider -q http://localhost:9090/favicon.ico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  targets:
    name: Select supported targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      deb_matrix: ${{ steps.matrix.outputs.deb_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: matrix
        name: Build target matrix from this Go release
        shell: bash
        run: |
          matrix="$(make release-targets | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          deb_matrix="$(make deb-targets | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "deb_matrix=$deb_matrix" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build ${{ matrix.target }}
    needs:
      - test
      - targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: package
        name: Cross-compile and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          make archive TARGET="${TARGET}" VERSION="${VERSION}"
          archive="$(make archive-path TARGET="${TARGET}")"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "name=mitmania-${TARGET}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  debian-packages:
    name: Package Debian from ${{ matrix.go_target }}
    needs:
      - binaries
      - targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go_target: ${{ fromJSON(needs.targets.outputs.deb_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install debx
        run: python -m pip install debx==0.2.12
      - uses: actions/download-artifact@v4
        with:
          name: mitmania-${{ matrix.go_target }}
          path: binary-artifact
      - name: Reuse the release binary and build the package
        shell: bash
        env:
          GO_TARGET: ${{ matrix.go_target }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p bin binary-artifact/unpacked
          tar -xzf "binary-artifact/mitmania-${GO_TARGET}.tar.gz" -C binary-artifact/unpacked
          mv binary-artifact/unpacked/mitmania "bin/mitmania-${GO_TARGET}"
          touch "bin/mitmania-${GO_TARGET}"
          make deb TARGET="${GO_TARGET}" VERSION="${RELEASE_TAG}"
      - name: Verify the Debian package
        shell: bash
        run: |
          set -euo pipefail
          package=(dist/*.deb)
          test "${#package[@]}" -eq 1
          debx inspect --format find "${package[0]}"
          debx unpack "${package[0]}" --directory unpacked
          grep -Fx /etc/default/mitmania unpacked/control/conffiles
          grep -Fx 'EnvironmentFile=/etc/default/mitmania' unpacked/data/usr/lib/systemd/system/mitmania.service
          grep -Fx 'DynamicUser=yes' unpacked/data/usr/lib/systemd/system/mitmania.service
          test "$(stat -c %a unpacked/data/etc/default/mitmania)" = 600
          cmp "bin/mitmania-${{ matrix.go_target }}" unpacked/data/usr/bin/mitmania
      - uses: actions/upload-artifact@v4
        with:
          name: mitmania-deb-${{ matrix.go_target }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  release-assets:
    name: Upload release assets
    needs:
      - binaries
      - debian-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # gh infers the target repo from the local git remote by default;
          # this job only downloads artifacts, it never checks the repo
          # out, so without GH_REPO it fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${RELEASE_TAG}" release/* --clobber

  container:
    name: Publish multi-platform container
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: mitmania-linux-*
          path: container-artifacts
          merge-multiple: true
      - name: Prepare previously built Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(container-artifacts/mitmania-linux-*.tar.gz)
          if (( ${#archives[@]} == 0 )); then
            echo "No Linux binary artifacts were downloaded" >&2
            exit 1
          fi

          for archive in "${archives[@]}"; do
            name="$(basename "${archive}" .tar.gz)"
            target="${name#mitmania-}"
            mkdir -p "docker-binaries/${target}"
            tar -xzf "${archive}" -C "docker-binaries/${target}"
          done

          for target in \
            linux-386 \
            linux-amd64 \
            linux-armv7 \
            linux-arm64 \
            linux-ppc64le \
            linux-riscv64 \
            linux-s390x; do
            test -x "docker-binaries/${target}/mitmania"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Normalize image name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
