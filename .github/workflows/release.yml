name: release

on:
  release:
    types:
      - published

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  targets:
    name: Select supported targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: matrix
        name: Build target matrix from this Go release
        shell: bash
        run: |
          matrix="$({ go tool dist list -json; } | jq -c '
            map(select(
              .GOOS as $os
              | [
                  "aix",
                  "darwin",
                  "dragonfly",
                  "freebsd",
                  "illumos",
                  "linux",
                  "netbsd",
                  "openbsd",
                  "solaris",
                  "windows"
                ]
              | index($os)
            ))
          ')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build ${{ matrix.target.GOOS }}/${{ matrix.target.GOARCH }}
    needs:
      - test
      - targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: package
        name: Cross-compile and package
        shell: bash
        env:
          GOOS: ${{ matrix.target.GOOS }}
          GOARCH: ${{ matrix.target.GOARCH }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          target="${GOOS}-${GOARCH}"
          binary="mitmania"
          if [[ "${GOARCH}" == "arm" ]]; then
            export GOARM=7
            target="${target}v7"
          fi
          if [[ "${GOOS}" == "windows" ]]; then
            binary="${binary}.exe"
          fi

          package_dir="dist/${target}"
          mkdir -p "${package_dir}"
          make build VERSION="${VERSION}" OUTPUT="${package_dir}/${binary}"

          if [[ "${GOOS}" == "windows" ]]; then
            archive="dist/mitmania-${target}.zip"
            (cd "${package_dir}" && zip -9 "../$(basename "${archive}")" "${binary}")
          else
            archive="dist/mitmania-${target}.tar.gz"
            tar -czf "${archive}" -C "${package_dir}" "${binary}"
          fi

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "name=mitmania-${target}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  release-assets:
    name: Upload release assets
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum mitmania-* > SHA256SUMS
      - name: Upload to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # gh infers the target repo from the local git remote by default;
          # this job only downloads artifacts, it never checks the repo
          # out, so without GH_REPO it fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${RELEASE_TAG}" release/* --clobber

  container:
    name: Publish multi-platform container
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Normalize image name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
