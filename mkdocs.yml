site_name: mitmania
site_description: Distributed policy and interception proxy for controlled egress
site_url: https://docs.mitmania.com/
docs_dir: docs

theme:
  name: shadcn
  show_stargazers: true

plugins:
  - search
  - mermaid2:
      javascript: assets/javascripts/mermaid.mjs
  - redirects:
      redirect_maps: {}
  - mike:
      alias_type: symlink
      canonical_version: latest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: docs
      check_paths: true

nav:
  - Home: index.md
  - Concepts:
      - What mitmania is: concepts/overview.md
      - Control plane vs. data plane: concepts/control-plane.md
      - Request pipeline: concepts/pipeline.md
      - Interception & certificates: concepts/certificates.md
      - Identity, rules & phases: concepts/identity-rules.md
      - Distributed operation: concepts/distributed.md
      - State & storage: concepts/storage.md
  - Get started:
      - Install: start/install.md
      - First run (single node): start/first-run.md
      - Trust the CA: start/trust-ca.md
      - Point a client: start/point-client.md
      - Verify it works: start/verify.md
  - Use cases:
      - Overview: usecases/index.md
      - Policy proxy without MITM: usecases/no-mitm.md
      - Egress firewall & SSRF guard: usecases/egress.md
      - Authenticating forward proxy: usecases/auth-proxy.md
      - Header & credential injection: usecases/injection.md
      - Block, rewrite, redact: usecases/mutation.md
      - Agent / sandbox containment: usecases/containment.md
      - Transparent interception (TPROXY/REDIRECT): usecases/transparent.md
      - Central policy via broker: usecases/broker.md
      - Debugging & inspecting TLS: usecases/debugging.md
  - Tutorials:
